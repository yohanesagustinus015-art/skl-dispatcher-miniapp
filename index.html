<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dashboard Dispatcher - PT SKL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Same PT SKL brand system as the mechanic Mini App -- matches
     skl-route-agent/dashboard.html exactly, see that app's own SKILL.md
     note for the reasoning (2026-08-27 design pass). */
  :root {
    --bg: #F5F2EE; --surface: #FFFFFF; --surface2: #F0EBE4; --surface3: #E5DDD3;
    --border: #E2D9CC; --accent: #8B1A1A; --accent-hover: #6E1414; --accent-dim: #F3E3E3;
    --text: #2B2420; --muted: #7A6F63; --dim: #B0A594;
    --green: #1E8449; --red: #B91C1C;
    --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif; --display: 'Fraunces', serif;
    /* UI/UX pass 3, 2026-09-17, direct feedback ("work on the spacing
       rhythm"): every padding/margin/gap in this file used to be
       whatever felt right in the moment -- 4, 6, 9, 10, 13, 14, 18px
       all appeared, often for values that should have matched (a
       card's own padding vs. the card next to it). One 4px-based
       scale now, applied everywhere below; a handful of genuinely
       different things (the 1-3px optical nudges on h1/card-title
       baselines, the tab pill's own 3px inset, border widths, the
       not-telegram fallback's one-off 60px) are deliberately NOT on
       this scale -- see each one's own comment for why. */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-7: 32px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--space-4) var(--space-4) var(--space-7);
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    font-size: 15px; line-height: 1.5;
  }
  h1 {
    font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--accent);
    letter-spacing: -0.01em; margin: 4px 0 2px;
  }
  /* UI/UX pass, 2026-09-17: the truck id is the one thing a dispatcher
     scans for first on every card (three separate lists, all keyed by
     truck) but previously had no more visual weight than the meta text
     next to it -- same 13px size bracket as everything else. Bumped to
     its own size, tightened letter-spacing (mono faces read loose at
     small sizes without it). */
  .truck-id { font-size: 15px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: var(--space-4); }
  /* UI/UX pass, 2026-09-17, direct feedback ("the ui/ux is kinda bad,
     apple treatment it"): sliding-pill segmented control replacing the
     flat underline tabs. tab-indicator is a real positioned sibling
     (not a pseudo-element) so JS can animate its transform on tap --
     ::before/::after can't be targeted by inline style from script. */
  .tabs {
    position: relative; display: flex; background: var(--surface2);
    border-radius: 10px; padding: 3px; margin-bottom: var(--space-5);
  }
  .tab-indicator {
    position: absolute; top: 3px; bottom: 3px; left: 3px;
    width: calc((100% - 6px) / 3); background: var(--surface);
    border-radius: 8px; box-shadow: 0 1px 3px rgba(43, 36, 32, 0.12);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); z-index: 0;
  }
  .tab {
    flex: 1; position: relative; z-index: 1; text-align: center; padding: var(--space-2) var(--space-1);
    font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
    white-space: nowrap; border-radius: 8px; transition: color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--accent); }
  /* Screens fade+lift in on activation instead of an instant display
     snap -- same 0.2s ease timing as the tab indicator above, so
     switching tabs reads as one coherent motion, not two unrelated
     effects at different speeds. */
  .screen { display: none; }
  .screen.active { display: block; animation: screenIn 0.2s ease both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .screen.active, .repair-card, .card, .yard-card { animation: none !important; }
    .tab-indicator, .tab, button, .toast { transition: none !important; }
    .skeleton-line::after { animation: none !important; }
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: var(--space-4) 0 var(--space-2); }
  select, input, textarea {
    width: 100%; padding: var(--space-3); border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 15px; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .empty { color: var(--dim); text-align: center; padding: var(--space-7) 0; font-size: 14px; }
  .empty svg { display: block; margin: 0 auto var(--space-3); opacity: 0.55; }
  /* UI/UX pass, 2026-09-17: replaces the plain "Memuat..." text with a
     shimmering placeholder shaped like the card it's about to become --
     the shape itself previews the layout, and the shimmer reads as
     "actively working" rather than a static word sitting on screen. */
  .skeleton-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: var(--space-4); margin-bottom: var(--space-3);
  }
  .skeleton-line {
    height: 12px; border-radius: 6px; background: var(--surface2);
    margin-bottom: var(--space-2); overflow: hidden; position: relative;
  }
  .skeleton-line:last-child { margin-bottom: 0; }
  .skeleton-line::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: translateX(-100%); animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .skeleton-line.w40 { width: 40%; }
  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w80 { width: 80%; }
  /* UI/UX pass, 2026-09-17: softer radius + a real (if subtle) shadow
     in place of the old flat 1px-border-only card -- gives cards actual
     depth instead of reading as outlined rectangles. cardIn (defined
     above, alongside screenIn) plays once per freshly-rendered card
     since innerHTML replacement always creates new DOM nodes -- no
     extra JS needed to trigger it per render. */
  .repair-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: var(--space-3); overflow: hidden;
    box-shadow: 0 1px 2px rgba(43, 36, 32, 0.04), 0 2px 10px rgba(43, 36, 32, 0.05);
    animation: cardIn 0.25s ease both;
  }
  /* display:flex directly on <summary> is unreliable in Safari (same
     real bug found and fixed in mekanik-miniapp, 2026-09-03 -- Android/
     Chromium is the only engine that reliably flexes a <summary> itself).
     Flex layout lives on .repair-summary-row, an ordinary <div> nested
     inside the summary, instead. */
  .repair-summary {
    display: block; padding: var(--space-4); cursor: pointer; list-style: none;
    -webkit-tap-highlight-color: transparent; transition: background 0.15s ease;
  }
  .repair-summary:active { background: var(--surface2); }
  .repair-summary::-webkit-details-marker { display: none; }
  .repair-summary-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  }
  .repair-summary-row::after {
    content: "\25B8"; color: var(--muted); font-size: 12px; flex-shrink: 0;
    transition: transform 0.15s;
  }
  .repair-card[open] .repair-summary-row::after { transform: rotate(90deg); }
  .repair-summary .truck-id { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .repair-summary-meta {
    font-size: 13px; color: var(--muted); text-align: right; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  /* Direct feedback, 2026-09-02: "make it apparent which ones are
     complete (mechanic closed, awaiting sign-off only) and which are
     ongoing" -- status used to only show as plain text buried inside
     the expanded card body (Status: ...), invisible in the collapsed
     list a dispatcher actually scans. Now a chip on the summary row
     itself, colored so pending_signoff visibly stands out as the one
     that needs dispatcher attention (sign off, or wait for a real
     mechanic) versus open (still being worked, nothing for dispatcher
     to do but request parts if asked). */
  .status-chip {
    display: inline-block; margin-top: var(--space-2); padding: 2px var(--space-2); border-radius: 10px;
    font-size: 11px; font-weight: 600; font-family: var(--sans);
  }
  .status-chip-open { background: var(--surface2); color: var(--muted); }
  .status-chip-pending_signoff { background: #FCEFD8; color: #9A5B0A; }
  .status-chip-signed_off { background: #E1F0E6; color: var(--green); }
  .repair-body { padding: 0 var(--space-4) var(--space-4); }
  /* Plain (non-collapsible) card -- new for the dedicated Sign-off tab
     (2026-09-03: 'dispatcher should have the same Sign-off tab as
     mechanic'), same box as .repair-card but without the <details>
     collapse since a sign-off card has nothing worth hiding. */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: var(--space-4); margin-bottom: var(--space-3);
    box-shadow: 0 1px 2px rgba(43, 36, 32, 0.04), 0 2px 10px rgba(43, 36, 32, 0.05);
    animation: cardIn 0.25s ease both;
  }
  .card-title { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 2px; }
  .issue-row { padding: var(--space-2) 0; font-size: 14px; }
  .card-meta { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .card-section { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .issue-edit-row { padding: var(--space-3) 0; border-top: 1px solid var(--border); }
  .issue-edit-row:first-child { border-top: none; padding-top: 0; }
  .issue-edit-row .issue-name { font-size: 14px; font-weight: 600; margin-bottom: var(--space-2); }
  .issue-status-badge { display: inline-block; font-size: 11px; font-weight: 600; font-family: var(--sans); border-radius: 10px; padding: 2px var(--space-2); margin-left: var(--space-1); vertical-align: middle; }
  /* UI/UX pass, 2026-09-17: every lifecycle stage used to share this ONE
     gray badge regardless of meaning -- a dispatcher scanning a card
     couldn't tell "still needs parts" from "verified and done" without
     reading the label text itself. Same 3-color semantic system
     status-chip already uses one level up (session status), applied
     here per-issue: neutral (nothing to act on yet), amber (waiting on
     someone/something external), accent (actively being worked),
     green (functionally finished). An unrecognized status still falls
     back to the neutral look via the bare .issue-status-badge rule
     above, since ${issue.status} always appends SOME class name here. */
  .issue-status-badge-reported, .issue-status-badge-diagnosed { background: var(--surface2); color: var(--muted); }
  .issue-status-badge-request_for_parts, .issue-status-badge-vendor_selected { background: #FCEFD8; color: #9A5B0A; }
  .issue-status-badge-in_progress { background: var(--accent-dim); color: var(--accent); }
  .issue-status-badge-done, .issue-status-badge-verified { background: #E1F0E6; color: var(--green); }
  .issue-vendor-note { font-size: 12.5px; color: var(--muted); margin: var(--space-2) 0; }
  .btn-start-progress { width: 100%; margin: var(--space-1) 0 var(--space-2); padding: var(--space-2); border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-dim); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-request-parts { width: 100%; margin-top: var(--space-2); padding: var(--space-2); border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-dim); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
  .signoff-section textarea { min-height: 60px; }
  .issue-edit-row label { margin: var(--space-1) 0; }
  button.primary {
    width: 100%; margin-top: var(--space-4); padding: var(--space-3); border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; }
  /* UI/UX pass, 2026-09-17: every button gets real tap feedback (a
     slight scale-down) instead of only a :hover state, which a
     touchscreen never triggers -- covers .btn-start-progress,
     .btn-request-parts, .btn-dispatcher-signoff, .btn-yard-note-submit,
     and the yard bucket buttons below, all of which reuse this rule
     rather than each declaring their own. */
  button:not(:disabled):active { transform: scale(0.97); }
  /* Floating pill instead of a full-width bar pinned to the bottom edge
     -- reads as a message TO the dispatcher, not a bar of the app's own
     chrome. display:none replaced with an opacity/transform transition
     (toggled via the .show class in the toast() function below) so it
     actually animates in/out instead of snapping. */
  .toast {
    position: fixed; left: 50%; bottom: var(--space-6); max-width: calc(100% - 32px);
    padding: var(--space-3) var(--space-5); border-radius: 999px; background: var(--text); color: var(--bg);
    font-size: 13.5px; font-weight: 500; text-align: center; z-index: 10;
    box-shadow: 0 6px 20px rgba(43, 36, 32, 0.25);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* 60px stays a literal, not a scale step -- this is the one screen
     that's ALL whitespace (a centered fallback message, nothing else
     on it), so it wants a deliberately larger breather than any card
     rhythm value would give it. */
  .not-telegram { text-align: center; padding: 60px var(--space-5); color: var(--muted); }
  .yard-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: var(--space-4); margin-bottom: var(--space-3);
    box-shadow: 0 1px 2px rgba(43, 36, 32, 0.04), 0 2px 10px rgba(43, 36, 32, 0.05);
    animation: cardIn 0.25s ease both;
  }
  .yard-card-title { display: flex; align-items: center; justify-content: space-between; }
  .yard-card-title .truck-id { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .yard-card-system { font-size: 13px; color: var(--muted); }
  /* 2x2 grid, not a 4-wide flex row -- 4 buttons across one row on a
     phone screen made "Under repair"/"At Indahkiat" wrap and cramp, same
     lesson as the tab-label fix in the mechanic app (shorten/reflow
     instead of shrinking font past readable). */
  .yard-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-3); }
  .yard-buttons button {
    padding: var(--space-2) var(--space-1); border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .yard-buttons button.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .yard-mismatch-note { font-size: 12px; color: var(--red); margin-top: var(--space-2); }
  .yard-note-form { margin-top: var(--space-3); }
  .yard-note-form textarea { min-height: 50px; }
</style>
</head>
<body>

<div id="notTelegram" class="not-telegram" style="display:none">
  Buka dashboard ini dari tombol "📋 Buka Dashboard Dispatcher" di chat bot SKL Lapangan, bukan dari browser langsung.
</div>

<div id="app" style="display:none">
  <h1>Dashboard Dispatcher</h1>
  <div class="subtitle" id="dispatcherName"></div>

  <div class="tabs" id="tabsWrap">
    <div class="tab-indicator" id="tabIndicator"></div>
    <div class="tab active" data-screen="repairs" data-index="0">Tinjau Servis</div>
    <div class="tab" data-screen="signoff" data-index="1">Sign-off</div>
    <div class="tab" data-screen="yard" data-index="2">Cek Pool</div>
  </div>

  <div class="screen active" id="screen-repairs">
    <div id="list-repairs">
      <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div>
      <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div>
    </div>
  </div>

  <div class="screen" id="screen-signoff">
    <div id="list-signoff">
      <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div>
    </div>
  </div>

  <div class="screen" id="screen-yard">
    <div id="list-yard">
      <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div></div>
      <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div></div>
      <div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Overridable via ?api=<url> (e.g. pointing at a local/staging
// dispatcher-api during testing) -- this page has no build step, so a
// query-param override is the only way to point it somewhere other than the
// substituted production URL above without editing PAGE and republishing.
// Falls back to that substituted value, so normal Telegram launches are
// unaffected.
const API_URL = new URLSearchParams(location.search).get("api") || "https://kcftvbuwotjjroattdak.supabase.co/functions/v1/dispatcher-api";
const tg = window.Telegram && window.Telegram.WebApp;

const BUCKET_LABELS = { pool: "Pool", under_repair: "Sedang diperbaiki", at_indahkiat: "Di Indahkiat", lainnya: "Lainnya", unknown: "Di luar (di jalan)", ferry: "Di feri" };

// Indonesian labels for repair_records.status -- direct feedback,
// 2026-08-29: "status: 'xxx' should have xx be in bahasa indonesia."
const STATUS_LABELS = { open: "Sedang dikerjakan", pending_signoff: "Menunggu sign-off", signed_off: "Sudah sign-off" };

// Per-issue lifecycle (2026-08-30 schema extension: repair_record_issues.status),
// separate from the session-level STATUS_LABELS above. Shown as a small badge
// per issue so dispatcher can see/verify it without a separate screen.
const ISSUE_STATUS_LABELS = {
  reported: "Dilaporkan",
  diagnosed: "Terdiagnosis",
  request_for_parts: "Minta suku cadang",
  vendor_selected: "Vendor dipilih",
  in_progress: "Sedang diperbaiki",
  done: "Selesai",
  verified: "Terverifikasi",
};

// UI/UX pass, 2026-09-17: N shimmering placeholder cards, shaped like
// the real card they're standing in for (a couple of lines of varying
// width), instead of the plain "Memuat..." word this replaced. Used
// both in the static initial markup (see screen-repairs/-signoff/-yard
// above) and here in JS for later refreshes that still show a loading
// state (see repairsLoaded/yardLoaded's own comments for when that is).
function skeletonHtml(n) {
  return Array.from({ length: n })
    .map(() => `<div class="skeleton-card"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div>`)
    .join("");
}

// A plain checkmark-circle, not a photo or a specific object -- every
// empty state here means "nothing needs your attention right now,"
// the same idea regardless of which tab, so one icon covers all three
// rather than commissioning a distinct illustration per screen.
const EMPTY_ICON = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function call(action, payload) {
  const resp = await fetch(API_URL, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ initData: tg.initData, action, payload: payload || {} }),
  });
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    // Logged once here (every call site already surfaces body.error to the
    // dispatcher via a toast) so a real failure leaves a trail in the
    // webview's own console -- previously the only record of a failure was
    // whatever the dispatcher could read off the toast and relay verbatim.
    console.error("dispatcher-api call failed:", action, resp.status, body);
    throw new Error(body.error || ("HTTP " + resp.status));
  }
  return body;
}

function setScreen(name) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.screen === name));
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === "screen-" + name));
  if (name === "repairs") loadRepairs();
  if (name === "yard") loadYard();
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })
    + " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}

// Direct feedback, 2026-09-02: same load-speed pass already done on
// mekanik-miniapp (prefetch + cache + combined backend call). Track
// whether each list has ever loaded so only the very first load wipes
// to "Memuat..." -- later refreshes (tab click, or after a mutating
// action) keep showing the last-known content while quietly
// refreshing behind it. See renderRepairs' own className comment for
// a real bug that pattern needs to watch for.
let repairsLoaded = false;

// Single combined fetch feeds both Tinjau Servis and Sign-off --
// direct instruction 2026-09-03: "dispatcher should have the same
// Sign-off tab as mechanic for all things that only require sign
// off." fetchActiveRepairs already returns every repair not yet
// signed_off (open AND pending_signoff together, see that function's
// own comment); split here by status instead of adding a second
// backend action/round trip, since the data's already all there.
async function loadRepairs() {
  const openEl = document.getElementById("list-repairs");
  const signoffEl = document.getElementById("list-signoff");
  if (!repairsLoaded) {
    openEl.className = "";
    openEl.innerHTML = skeletonHtml(2);
    signoffEl.className = "";
    signoffEl.innerHTML = skeletonHtml(1);
  }
  const { repairs } = await call("list_pending_repairs");
  renderRepairs(repairs);
}

function renderRepairs(repairs) {
  repairsLoaded = true;
  const all = repairs || [];
  renderOpenRepairs(all.filter((r) => r.status === "open"));
  renderSignoffRepairs(all.filter((r) => r.status === "pending_signoff"));
}

function renderOpenRepairs(repairs) {
  const el = document.getElementById("list-repairs");
  const openIds = new Set(
    [...el.querySelectorAll("details.repair-card[open]")].map((d) => d.dataset.id),
  );
  if (!repairs || repairs.length === 0) {
    el.className = "empty";
    el.innerHTML = EMPTY_ICON + "Tidak ada servis yang perlu dilengkapi.";
    return;
  }
  // Real bug this pattern can hit if skipped (found in mekanik-miniapp,
  // 2026-09-03, from a screenshot): className must be reset here, not
  // just before the very first fetch -- otherwise a list that was ever
  // empty (className="empty", center-aligned) and later gets real
  // content keeps showing centered text with the new content in it.
  el.className = "";
  el.innerHTML = repairs
    .map((r) => {
      const issues = r.repair_record_issues || [];
      return `
      <details class="repair-card" data-id="${r.id}" ${openIds.has(r.id) ? "open" : ""}>
        <summary class="repair-summary">
          <div class="repair-summary-row">
            <span class="truck-id">Truk ${r.truck_id}</span>
            <span class="repair-summary-meta">Servis #${r.seq} &middot; ${issues.length} masalah</span>
          </div>
          <span class="status-chip status-chip-${r.status}">${STATUS_LABELS[r.status] || r.status}</span>
        </summary>
        <div class="repair-body">
          <div class="card-meta">Mulai ${formatDate(r.downtime_start)}</div>
          <div class="card-section">
            ${issues
              .map((issue, i) => `
                <div class="issue-edit-row" data-issue-id="${issue.id}">
                  <div class="issue-name">${issue.failure_modes ? issue.failure_modes.name : "(lainnya)"}${issue.description ? " -- " + issue.description : ""} <span class="issue-status-badge issue-status-badge-${issue.status}">${ISSUE_STATUS_LABELS[issue.status] || issue.status || ""}</span></div>
                  ${(() => {
                    if (issue.status === "done" || issue.status === "verified") return "";
                    const blocks = [];
                    // 2026-08-31, direct feedback: dispatcher often
                    // receives incoming deliveries, so may see a part
                    // arrive before the mechanic does -- let them
                    // trigger Mulai Perbaikan too, same approval gate.
                    if (issue.status === "vendor_selected") {
                      const quotes = issue.vendor_quotes || [];
                      const approved = quotes.find((q) => q.is_selected && q.approved_by_owner);
                      if (approved) {
                        blocks.push(`<div class="issue-vendor-note">Vendor: ${approved.vendor_name} -- sudah disetujui</div><button class="btn-start-progress" data-issue-id="${issue.id}">Mulai Perbaikan (Part Sudah Sampai)</button>`);
                      } else {
                        const selected = quotes.find((q) => q.is_selected);
                        blocks.push(`<div class="issue-vendor-note">${selected ? "Menunggu persetujuan pemilik: " + selected.vendor_name : "Menunggu staff memilih vendor"}</div>`);
                      }
                    }
                    // Redefined 2026-09-03, direct instruction: callable
                    // repeatedly for any status short of done/verified
                    // (was: only ever once, at 'reported') -- "needs to
                    // be allowed multiple times ... in case they forget
                    // to type something ... even while sedang
                    // dikerjakan." Shows what's already been requested
                    // so a repeat submission reads as adding to it.
                    const already = issue.parts_used ? `<div class="issue-vendor-note">Sudah diajukan: ${issue.parts_used}</div>` : "";
                    blocks.push(`
                      ${already}
                      <label>${issue.parts_used ? "Tambah suku cadang lain (opsional)" : "Suku cadang dibutuhkan (kosongkan jika tidak perlu beli apa-apa)"}</label>
                      <input type="text" class="issue-parts-needed" placeholder="mis. kampas rem" />
                      <button class="btn-request-parts">${issue.parts_used ? "Ajukan Tambahan" : "Ajukan Permintaan Suku Cadang"}</button>
                    `);
                    return blocks.join("");
                  })()}
                </div>
              `)
              .join("")}
          </div>
        </div>
      </details>
    `;
    })
    .join("");

  el.querySelectorAll(".btn-start-progress").forEach((btn) => {
    btn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      btn.disabled = true;
      try {
        await call("start_progress_from_vendor", { id: btn.dataset.issueId });
        toast("Perbaikan dimulai.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  // Per-issue, mirrors mekanik-miniapp's own request-parts button --
  // see the template's own comment for why this replaced the old
  // whole-card btn-complete.
  el.querySelectorAll(".btn-request-parts").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const row = btn.closest(".issue-edit-row");
      const card = btn.closest(".repair-card");
      btn.disabled = true;
      try {
        await call("request_parts", {
          repair_record_id: card.dataset.id,
          issues: [{ id: row.dataset.issueId, parts_used: row.querySelector(".issue-parts-needed").value }],
        });
        toast("Permintaan suku cadang diajukan.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

}

// Dedicated Sign-off tab (2026-09-03, direct instruction: "dispatcher
// should have the same Sign-off tab as mechanic for all things that
// only require sign off"). Was previously a section embedded inside a
// Tinjau Servis card when status happened to be pending_signoff --
// pulled out into its own tab/screen to match the mechanic app's own
// split (Diperbaiki vs Sign-off), so a dispatcher scanning for what
// needs a decision doesn't have to open every Tinjau Servis card to
// find the ones actually awaiting sign-off.
function renderSignoffRepairs(repairs) {
  const el = document.getElementById("list-signoff");
  if (!repairs || repairs.length === 0) {
    el.className = "empty";
    el.innerHTML = EMPTY_ICON + "Tidak ada servis menunggu sign-off.";
    return;
  }
  el.className = "";
  el.innerHTML = repairs
    .map((r) => {
      const issues = r.repair_record_issues || [];
      return `
      <div class="card" data-id="${r.id}">
        <div class="card-title">
          <span class="truck-id">Truk ${r.truck_id}</span>
          <span class="status-chip status-chip-pending_signoff">${STATUS_LABELS.pending_signoff}</span>
        </div>
        <div class="card-meta">Servis #${r.seq} &middot; Mulai ${formatDate(r.downtime_start)}${r.repaired_by_mechanic ? " &middot; oleh " + r.repaired_by_mechanic.name : ""}</div>
        <div class="card-section">
          ${issues.map((i) => `<div class="issue-row">${i.failure_modes ? i.failure_modes.name : "(lainnya)"}${i.description ? " -- " + i.description : ""} <span class="issue-status-badge issue-status-badge-${i.status}">${ISSUE_STATUS_LABELS[i.status] || i.status || ""}</span></div>`).join("") || '<div class="issue-row">(belum ada masalah tercatat)</div>'}
        </div>
        <div class="card-section signoff-section" data-id="${r.id}">
          <label>Alasan (wajib) -- kenapa mekanik lain tidak bisa konfirmasi sendiri?</label>
          <textarea class="signoff-reason" placeholder="mis. mekanik lain sedang di lapangan, tidak ada yang bisa hadir hari ini"></textarea>
          <button class="primary btn-dispatcher-signoff">Konfirmasi Selesai (Sign-off)</button>
        </div>
      </div>
    `;
    })
    .join("");

  // New, direct instruction 2026-09-02: dispatcher can sign off a
  // repair the mechanic already marked done, but only with a typed
  // reason -- refused client-side (and server-side too) if empty.
  el.querySelectorAll(".btn-dispatcher-signoff").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const section = btn.closest(".signoff-section");
      const reason = section.querySelector(".signoff-reason").value.trim();
      if (!reason) {
        toast("Alasan wajib diisi -- kenapa mekanik lain tidak bisa konfirmasi sendiri?");
        return;
      }
      btn.disabled = true;
      try {
        await call("dispatcher_sign_off", { id: section.dataset.id, reason });
        toast("Sign-off tercatat.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });
}

let yardLoaded = false;

async function loadYard() {
  const el = document.getElementById("list-yard");
  if (!yardLoaded) {
    el.className = "";
    el.innerHTML = skeletonHtml(3);
  }
  const { checkins } = await call("list_yard_checkins");
  renderYard(checkins);
}

function renderYard(checkins) {
  const el = document.getElementById("list-yard");
  yardLoaded = true;
  if (!checkins || checkins.length === 0) {
    el.className = "empty";
    el.innerHTML = EMPTY_ICON + "Tidak ada truk untuk dicek hari ini.";
    return;
  }
  el.className = "";
  el.innerHTML = checkins
    .map((c) => {
      const current = c.dispatcher_state || c.system_state;
      const mismatchNote = c.already_confirmed && !c.matched
        ? `<div class="yard-mismatch-note">Sistem: ${BUCKET_LABELS[c.system_state] || c.system_state}${c.note ? " -- " + c.note : " -- berbeda dari konfirmasi"}</div>`
        : "";
      return `
      <div class="yard-card" data-truck="${c.truck_id}">
        <div class="yard-card-title">
          <span class="truck-id">Truk ${c.truck_id}</span>
          <span class="yard-card-system">Sistem: ${BUCKET_LABELS[c.system_state] || c.system_state}</span>
        </div>
        <div class="yard-buttons">
          ${["pool", "under_repair", "at_indahkiat", "lainnya"]
            .map((b) => `<button data-bucket="${b}" class="${current === b ? "selected" : ""}">${BUCKET_LABELS[b]}</button>`)
            .join("")}
        </div>
        <div class="yard-note-form" style="display:none">
          <label>Catatan (wajib untuk Lainnya)</label>
          <textarea class="yard-note-input" placeholder="Jelaskan kondisi truk ini..."></textarea>
          <button class="primary btn-yard-note-submit">Konfirmasi</button>
        </div>
        ${mismatchNote}
      </div>
    `;
    })
    .join("");

  el.querySelectorAll(".yard-card").forEach((card) => {
    const noteForm = card.querySelector(".yard-note-form");

    const submit = async (bucket, note) => {
      card.querySelectorAll(".yard-buttons button, .btn-yard-note-submit").forEach((b) => (b.disabled = true));
      try {
        await call("confirm_checkin", { truck_id: card.dataset.truck, dispatcher_state: bucket, note });
        toast("Dikonfirmasi.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadYard();
      } catch (e) {
        toast("Gagal: " + e.message);
        card.querySelectorAll(".yard-buttons button, .btn-yard-note-submit").forEach((b) => (b.disabled = false));
      }
    };

    card.querySelectorAll(".yard-buttons button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.bucket === "lainnya") {
          noteForm.style.display = "block";
          card.querySelector(".yard-note-input").focus();
          return;
        }
        noteForm.style.display = "none";
        submit(btn.dataset.bucket, null);
      });
    });

    card.querySelector(".btn-yard-note-submit").addEventListener("click", () => {
      const note = card.querySelector(".yard-note-input").value.trim();
      if (!note) {
        toast("Catatan wajib diisi untuk Lainnya.");
        return;
      }
      submit("lainnya", note);
    });
  });
}

// Moves the sliding pill behind the tapped tab -- a real element's
// transform, not a pseudo-element, since only real elements can be
// targeted by inline style from script (see .tab-indicator's own CSS
// comment). translateX in multiples of 100% of the indicator's OWN
// width (already 1/3 of the bar), so this needs no measurement/
// resize-observer math -- just the tapped tab's fixed index.
function moveTabIndicator(index) {
  document.getElementById("tabIndicator").style.transform = `translateX(${index * 100}%)`;
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    moveTabIndicator(Number(tab.dataset.index));
    setScreen(tab.dataset.screen);
  });
});

(async function init() {
  if (!tg) {
    document.getElementById("notTelegram").style.display = "block";
    return;
  }
  tg.ready();
  tg.expand();
  document.getElementById("app").style.display = "block";
  const greetName = tg.initDataUnsafe?.user?.first_name;
  document.getElementById("dispatcherName").textContent = greetName ? "Halo, " + greetName : "";
  // Combined single request (2026-09-02, same fix as mekanik-miniapp):
  // one init_data call instead of two separate round trips
  // (list_pending_repairs + list_yard_checkins), rendering both tabs
  // immediately from the one response.
  try {
    const { repairs, checkins } = await call("init_data");
    renderRepairs(repairs);
    renderYard(checkins);
  } catch (e) {
    toast("Gagal memuat data: " + e.message);
  }
})();
</script>
